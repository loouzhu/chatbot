<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>验证码</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    "
  >
    <div
      style="
        max-width: 450px;
        margin: 0 auto;
        background: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      "
    >
      <!-- 标题 -->
      <h2 style="color: #333; margin: 0 0 8px 0; font-size: 20px">邮箱验证</h2>
      <p style="color: #888; font-size: 14px; margin: 0 0 20px 0">
        你好，{{ username }}
      </p>

      <!-- 提示文字 -->
      <p style="color: #555; font-size: 14px; margin: 0 0 16px 0">
        你的验证码是：
      </p>

      <!-- 验证码（大号显示） -->
      <div
        style="
          background: #f8f9fa;
          padding: 16px;
          border-radius: 6px;
          text-align: center;
          margin: 0 0 16px 0;
        "
      >
        <span
          style="
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #2c3e50;
            font-family: &quot;Courier New&quot;, monospace;
          "
        >
          {{ code }}
        </span>
      </div>

      <!-- 有效期 -->
      <p style="color: #999; font-size: 13px; margin: 0 0 4px 0">5分钟内有效</p>

      <!-- 安全提示 -->
      <p
        style="
          color: #999;
          font-size: 12px;
          margin: 16px 0 0 0;
          border-top: 1px solid #eee;
          padding-top: 16px;
        "
      >
        验证码请勿泄露，如果这不是你的操作，请忽略此邮件。
      </p>

      <!-- 底部 -->
      <p
        style="
          color: #ccc;
          font-size: 11px;
          margin: 20px 0 0 0;
          text-align: center;
        "
      >
        © ChatBot
      </p>
    </div>
  </body>
</html>
